# Render Blueprint: one web service running the booth app + LLM gateway.
# Dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: prompt-like-a-pro
    runtime: python
    plan: free
    buildCommand: pip install -r gateway/requirements.txt
    startCommand: ./render_start.sh
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # AI scoring is off by default (built-in offline scorer). To turn it on,
      # add ANTHROPIC_ACTIVE_KEY_1 in the service's Environment tab.
      - key: GATEWAY_ACTIVE_KEY_COUNT
        value: "1"
      - key: GATEWAY_SPARE_KEY_COUNT
        value: "0"
      # Booth → gateway bearer token and log-hash salt, generated by Render.
      - key: GATEWAY_TOKEN
        generateValue: true
      - key: GATEWAY_HASH_SALT
        generateValue: true
      # Required as an "X-Admin-Token" header to POST /api/reset.
      - key: ADMIN_TOKEN
        generateValue: true
    # The free plan's filesystem is wiped on every restart/redeploy, so the
    # SQLite leaderboard resets. To keep it, switch to a paid plan and
    # uncomment the disk below.
    # disk:
    #   name: plap-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # (and add an env var PLAP_DATA_DIR=/var/data)
